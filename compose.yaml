services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
