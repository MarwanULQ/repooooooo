name: Deploy to EC2

on:
  workflow_run:
    workflows: ["CD - Publish Docker Image"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          ansible-galaxy collection install community.docker

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Set deployment variables
        id: vars
        env:
          GH_REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "image=ghcr.io/${GH_REPOSITORY,,}:${COMMIT_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Deploy using Ansible
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          APP_IMAGE: ${{ steps.vars.outputs.image }}
        run: |
          printf '[app_servers]\n%s ansible_user=%s ansible_ssh_private_key_file=%s ansible_ssh_common_args="-o StrictHostKeyChecking=accept-new"\n' \
            "$EC2_HOST" "$EC2_USER" "$HOME/.ssh/ec2_key" > /tmp/inventory.ini

          export GHCR_USERNAME GHCR_TOKEN APP_IMAGE
          ansible-playbook -i /tmp/inventory.ini ansible/deploy.yml