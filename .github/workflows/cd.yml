name: CD - Publish Docker Image

on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Build and publish to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Set image name and tag
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -f dockerfile \
            -t "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}" \
            .

      - name: Push commit SHA tag
        run: |
          docker push "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}"

      - name: Tag and push latest
        run: |
          docker tag \
            "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}" \
            "${{ steps.image.outputs.name }}:latest"
          docker push "${{ steps.image.outputs.name }}:latest"
  deploy:
    name: Deploy application
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          ansible-galaxy collection install community.docker

      - name: Configure SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/ec2_key"
          chmod 600 "$HOME/.ssh/ec2_key"

      - name: Deploy with Ansible
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          APP_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          printf '[app_servers]\n%s ansible_user=%s ansible_ssh_private_key_file=%s ansible_ssh_common_args="-o StrictHostKeyChecking=accept-new"\n' \
            "$EC2_HOST" "$EC2_USER" "$HOME/.ssh/ec2_key" > /tmp/inventory.ini

          export GHCR_USERNAME GHCR_TOKEN APP_IMAGE
          ansible-playbook -i /tmp/inventory.ini ansible/deploy.yml