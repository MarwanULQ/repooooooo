name: CD - Publish Docker Image

on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Build and publish to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Set image name and tag
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -f dockerfile \
            -t "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}" \
            .

      - name: Push commit SHA tag
        run: |
          docker push "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}"

      - name: Tag and push latest
        run: |
          docker tag \
            "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}" \
            "${{ steps.image.outputs.name }}:latest"
          docker push "${{ steps.image.outputs.name }}:latest"