name: Rollback

on:
  push:
    branches:
      - main

jobs:
  rollback:
    name: Roll back application
    if: ${{ contains(github.event.head_commit.message, '(rollback ') && !contains(github.event.head_commit.message, 'skip') }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read rollback tag
        id: rollback
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          match="$(printf '%s\n' "$COMMIT_MESSAGE" | grep -oE '\(rollback[[:space:]]+[^[:space:]()]+\)' | head -n 1)"
          if [ -z "$match" ]; then
            echo 'Commit message must contain (rollback <TAG>).' >&2
            exit 1
          fi

          tag="$(printf '%s\n' "$match" | sed -E 's/^\(rollback[[:space:]]+//; s/\)$//')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag to immutable digest
        id: image-digest
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          ROLLBACK_TAG: ${{ steps.rollback.outputs.tag }}
        run: |
          image_ref="$IMAGE_NAME:$ROLLBACK_TAG"
          docker pull "$image_ref"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image_ref")"
          echo "image=$digest" >> "$GITHUB_OUTPUT"

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          ansible-galaxy collection install community.docker

      - name: Configure SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/ec2_key"
          chmod 600 "$HOME/.ssh/ec2_key"

      - name: Roll back with Ansible
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ROLLBACK_IMAGE: ${{ steps.image-digest.outputs.image }}
        run: |
          printf '[web]\n%s ansible_user=%s ansible_ssh_private_key_file=%s ansible_ssh_common_args="-o StrictHostKeyChecking=accept-new"\n' \
            "$EC2_HOST" "$EC2_USER" "$HOME/.ssh/ec2_key" > /tmp/inventory.ini

          export GHCR_USERNAME GHCR_TOKEN
          ansible-playbook -i /tmp/inventory.ini ansible/rollback.yml \
            -e "rollback_image=$ROLLBACK_IMAGE"
