- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install Docker and Compose
  apt:
    name: "{{ docker_packages }}"
    state: present

- name: Enable and start Docker
  service:
    name: docker
    state: started
    enabled: true

- name: Create deployment directory
  file:
    path: "{{ deploy_dir }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"