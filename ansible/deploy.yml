---
- name: Deploy application image
  hosts: app_servers
  become: true
  vars:
    deploy_dir: /opt/myapp

  tasks:
    - name: Log in to GHCR
      community.docker.docker_login:
        registry_url: ghcr.io
        username: "{{ lookup('env', 'GHCR_USERNAME') }}"
        password: "{{ lookup('env', 'GHCR_TOKEN') }}"
      no_log: true

    - name: Deploy selected image
      block:
        - name: Pull and recreate application
          community.docker.docker_compose_v2:
            project_src: "{{ deploy_dir }}"
            state: present
            pull: always
            recreate: always
          environment:
            APP_IMAGE: "{{ lookup('env', 'APP_IMAGE') }}"

        - name: Check application health endpoint
          ansible.builtin.uri:
            url: "http://127.0.0.1:5000/"
            method: GET
            status_code: 200
          register: health_result
          retries: 12
          delay: 5
          until: health_result.status == 200

      rescue:
        - name: Show application container logs
          ansible.builtin.command:
            cmd: docker compose logs --tail=100
            chdir: "{{ deploy_dir }}"
          register: app_logs
          changed_when: false
          failed_when: false

        - name: Print application logs
          ansible.builtin.debug:
            var: app_logs.stdout_lines

        - name: Fail deployment
          ansible.builtin.fail:
            msg: "Deployment or application health check failed."