- name: Deploy SonarQube
  hosts: sonarqube
  become: true

  vars_files:
    - sonarqube-vault.yml

  vars:
    deploy_dir: /opt/sonarqube
    sonar_db_password: "{{ vault_sonar_db_password }}"

  roles:
    - docker

  tasks:
    - name: Configure kernel settings for SonarQube
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-sonarqube.conf
        content: |
          vm.max_map_count=524288
          fs.file-max=131072
        owner: root
        group: root
        mode: "0644"
      register: sonar_sysctl

    - name: Apply kernel settings
      ansible.builtin.command: sysctl --system
      when: sonar_sysctl.changed
      changed_when: true

    - name: Create SonarQube deployment directory
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Copy Compose configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../sonarqube/compose.yaml"
        dest: "{{ deploy_dir }}/compose.yaml"
        owner: root
        group: root
        mode: "0644"

    - name: Create environment file with database password
      ansible.builtin.copy:
        dest: "{{ deploy_dir }}/.env"
        content: |
          SONAR_DB_PASSWORD={{ sonar_db_password }}
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart SonarQube

    - name: Start SonarQube Compose stack
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_dir }}"
        state: present
        pull: always

  handlers:
    - name: Restart SonarQube
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_dir }}"
        state: restarted
